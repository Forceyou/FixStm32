; PlatformIO Project Configuration
; ==================================
; Flix STM32 Quadcopter Firmware
; Platform:  STM32duino (Arduino Framework for STM32)
; Target:    STM32F407VET6 / STM32F407ZGT6 (discovery board)
;
; Build:    pio run
; Upload:   pio run -t upload
; Monitor:  pio device monitor -b 115200

[env:stm32f407_vet6]
platform      = ststm32
board         = disco_f407vg
framework     = arduino
monitor_speed = 115200

; ===== 编译选项 =====
build_flags =
    -D DEBUG=0
    -std=gnu++17
    -Os
    -ffunction-sections
    -fdata-sections

; ===== 第三方库 (PlatformIO Registry) =====
; FlixPeriph / MAVLink / SBUS 三个库作者都是 Oleg 或已在 Registry
lib_deps =
    okalachev/FlixPeriph@^1.12.1
    okalachev/MAVLink@^2.0.34
    brushlesspower/SBUS2@^1.2.0
